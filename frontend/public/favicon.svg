<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="threadGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="lineGrad1" x1="12" y1="20" x2="52" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="lineGrad2" x1="52" y1="20" x2="12" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Hex/Square -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#threadGrad)" stroke="#27272a" stroke-width="2"/>

  <!-- Interlaced Editorial "Thread" Curves -->
  <path d="M14 22 C 26 12, 38 32, 50 22 C 54 18, 54 26, 50 30 C 38 42, 26 22, 14 34 C 10 38, 10 46, 16 50 C 26 56, 42 48, 50 42" 
        stroke="url(#lineGrad1)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#glow)"/>
        
  <path d="M50 22 C 40 34, 24 30, 14 42" 
        stroke="url(#lineGrad2)" stroke-width="2.5" stroke-dasharray="3 3" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Autonomous Research Nodes -->
  <circle cx="14" cy="22" r="3.5" fill="#c084fc" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="32" cy="27" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="50" cy="22" r="3.5" fill="#f472b6" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="28" cy="41" r="3" fill="#a855f7" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="50" cy="42" r="3.5" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5" />
</svg>
